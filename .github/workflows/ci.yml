name: Quality Gate

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: restaurant_casv2_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 4100
      AUTH_USERNAME: ci-manager
      AUTH_PASSWORD: ci-manager-password-long
      AUTH_SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: restaurant_casv2_test
      DB_AUTO_MIGRATE: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.16
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Lint, typecheck, unit tests and build
        run: npm run check

      - name: Migrate, seed and audit isolated database
        run: |
          npm run db:migrate
          npm run db:seed:test
          npm run db:audit

      - name: Start API
        run: |
          npm run start:api > api.log 2>&1 &
          echo $! > api.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4100/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat api.log
          exit 1

      - name: API and MySQL smoke test
        run: npm run test:smoke

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start web
        run: |
          if ! curl --fail --silent http://127.0.0.1:4100/api/health > /dev/null; then
            echo "API stopped before Browser E2E."
            cat api.log
            exit 1
          fi
          npm run dev:web -- --host 127.0.0.1 > web.log 2>&1 &
          echo $! > web.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173 > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat web.pid)" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat web.log
          exit 1

      - name: Browser E2E
        env:
          PLAYWRIGHT_EXTERNAL_SERVERS: 'true'
        run: npm run test:e2e

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs
          path: |
            api.log
            web.log
          if-no-files-found: ignore
